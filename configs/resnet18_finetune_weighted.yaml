# Experiment E — ResNet18 partial fine-tuning + weighted CrossEntropyLoss.
# Same architecture/fine-tuning scope and optimizer settings as resnet18_finetune.
# Class weights are computed from the TRAINING split only at train time.

model: resnet18_finetune
use_class_weights: true
seed: 42
image_size: 224
batch_size: 16
num_workers: 2
epochs: 10
learning_rate: 0.0005
backbone_learning_rate: 0.0001
weight_decay: 0.0001
scheduler: cosine
early_stopping_patience: 3
monitor_metric: val_loss
maximize_monitor: false
run_name: resnet18_finetune_weighted
checkpoint_dir: checkpoints/resnet18_finetune_weighted
data_dir: data/chest_xray
split_file: experiments/data_split.json
